name: Test site

# Runs on every push to main, on pull requests, and on demand from the
# Actions tab. Uses nothing but Python's standard library, so there are no
# dependencies to install and nothing to go stale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Check the site before it goes out
    runs-on: ubuntu-latest

    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run site tests
        run: python3 test_site.py

      - name: Put the real failure in the summary
        if: failure()
        run: |
          echo "### Something in this commit would break the site" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The exact failures are below — no guessing needed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 test_site.py 2>&1 | grep -E "FAIL" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Each line names the file and the problem. A failure does **not**" >> $GITHUB_STEP_SUMMARY
          echo "take the site down — the page stays live and this is a warning" >> $GITHUB_STEP_SUMMARY
          echo "that something on it is wrong." >> $GITHUB_STEP_SUMMARY
