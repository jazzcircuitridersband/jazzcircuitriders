<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not in the book — Jazz Circuit Riders</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{ --ink:#0E1A2B; --brass:#C9922E; --brass-lit:#E8B75C; --cream:#F2E9D8; --steel:#8DA0B6;
  --display:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,'Cascadia Mono',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center;
  background:var(--ink); color:var(--cream); font-family:var(--sans); padding:32px; }
.wrap{ max-width:34ch; }
.eyebrow{ font-family:var(--mono); font-size:11.5px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--brass); margin:0 0 22px; }
h1{ font-family:var(--display); font-weight:400; font-size:clamp(2.2rem,8vw,3.4rem);
  line-height:1.05; letter-spacing:-.02em; margin:0 0 18px; }
p{ color:var(--steel); line-height:1.6; margin:0 0 30px; }
a.btn{ display:inline-block; font-family:var(--mono); font-size:12.5px; letter-spacing:.16em;
  text-transform:uppercase; text-decoration:none; padding:15px 26px;
  background:var(--brass); color:var(--ink); border:1px solid var(--brass); }
a.btn:hover{ background:var(--brass-lit); border-color:var(--brass-lit); }
a:focus-visible{ outline:2px solid var(--brass-lit); outline-offset:3px; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">404</p>
    <h1>That tune&rsquo;s not in the book.</h1>
    <p>Whatever you were after, we don&rsquo;t have a chart for it. The music, the dates and the booking details are all on the front page.</p>
    <a class="btn" href="/">Take it from the top</a>
  </main>
</body>
</html>
